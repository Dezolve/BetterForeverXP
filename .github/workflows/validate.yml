name: Validate and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Lua syntax
        shell: bash
        run: |
          if ! command -v luac >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq lua5.4
          fi
          luac -p BetterForeverXP/BetterForeverXP.lua
          luac -p BetterForeverXP/Options.lua

      - name: Validate addon
        shell: pwsh
        run: ./scripts/Test-Addon.ps1

      - name: Build release archive
        shell: pwsh
        run: ./scripts/Package-Addon.ps1

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: BetterForeverXP
          path: dist/*.zip
          if-no-files-found: error
