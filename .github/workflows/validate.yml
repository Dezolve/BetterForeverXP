name: Validate and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Lua syntax
        shell: bash
        run: |
          if ! command -v luac >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq lua5.4
          fi
          luac -p BetterForeverXP/BetterForeverXP.lua
          luac -p BetterForeverXP/Options.lua

      - name: Parse Windows auto-deploy script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/AutoDeploy-Windows.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Validate release metadata without publishing
        shell: pwsh
        run: ./scripts/Test-Release.ps1

      - name: Verify retired and mismatched tags are rejected
        shell: bash
        run: |
          set -euo pipefail
          if pwsh -NoProfile -File ./scripts/Test-Release.ps1 -Tag v2.6.1; then
            echo "::error::The already-published version 2.6.1 must be blocked."
            exit 1
          fi
          if pwsh -NoProfile -File ./scripts/Test-Release.ps1 -Tag v99.99.99; then
            echo "::error::A tag that differs from release metadata must be blocked."
            exit 1
          fi
          echo "Expected tag guard rejections PASS."

      - name: Validate addon
        shell: pwsh
        run: ./scripts/Test-Addon.ps1

      - name: Build release archive
        shell: pwsh
        run: ./scripts/Package-Addon.ps1

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: BetterForeverXP
          path: dist/*.zip
          if-no-files-found: error
