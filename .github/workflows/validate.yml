name: Validate and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate addon
        shell: pwsh
        run: ./scripts/Test-Addon.ps1

      - name: Build release archive
        shell: pwsh
        run: ./scripts/Package-Addon.ps1

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: BetterForeverXP
          path: dist/*.zip
          if-no-files-found: error
